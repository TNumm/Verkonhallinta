
---
- name: Install Node Exporter
  hosts:
    - web1
    - db1
  become: false

  vars:
    node_exporter_version: "1.9.1"
    node_exporter_dir: /opt/node_exporter
    node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    node_exporter_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}"

  tasks:
    - name: Create Node Exporter directory
      ansible.builtin.file:
        path: "{{ node_exporter_dir }}"
        state: directory
        mode: '0755'

    - name: Download Node Exporter
      ansible.builtin.get_url:
        url: "{{ node_exporter_url }}"
        dest: "/tmp/{{ node_exporter_archive }}"
        mode: '0644'

    - name: Extract Node Exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_archive }}"
        dest: "{{ node_exporter_dir }}"
        remote_src: yes
        extra_opts:
          - --strip-components=1

    - name: Start Node Exporter
      ansible.builtin.shell: |
        if ! pgrep -x node_exporter > /dev/null; then
          nohup {{ node_exporter_dir }}/node_exporter > /tmp/node_exporter.log 2>&1 &
        fi
      args:
        executable: /bin/bash

    - name: Verify Node Exporter
      ansible.builtin.uri:
        url: http://127.0.0.1:9100/metrics
        status_code: 200
